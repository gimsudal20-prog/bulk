name: 03 New Account Backfill
run-name: 03 New Account Backfill | ${{ inputs.account_name }} | ${{ inputs.start_date }}~${{ inputs.end_date }}

on:
  workflow_dispatch:
    inputs:
      account_name:
        description: "Account name for backfill"
        required: true
        type: string
      start_date:
        description: "Start date (YYYY-MM-DD)"
        required: true
        default: "2026-02-01"
        type: string
      end_date:
        description: "End date (YYYY-MM-DD)"
        required: true
        default: "2026-03-10"
        type: string
      workers:
        description: "Concurrent workers"
        required: true
        default: "1"
        type: string
      sync_dim_first_day:
        description: "Collect dimensions on the first day only"
        required: true
        default: true
        type: boolean
      shopping_only:
        description: "Shopping search campaigns only"
        required: false
        default: false
        type: boolean
      with_shop_ext:
        description: "Also run shop extension collection"
        required: false
        default: false
        type: boolean

concurrency:
  group: manual-new-account-backfill-${{ inputs.account_name }}
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NAVER_ADS_API_KEY: ${{ secrets.NAVER_ADS_API_KEY }}
      NAVER_ADS_SECRET: ${{ secrets.NAVER_ADS_SECRET }}
      ACCOUNT_MASTER_FILE: account_master.xlsx
      ACCOUNT_MASTER_XLSX_B64: ${{ secrets.ACCOUNT_MASTER_XLSX_B64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write workflow guide
        if: always()
        run: |
          {
            echo "## 03 New Account Backfill"
            echo
            echo "- Account: `${{ inputs.account_name }}`"
            echo "- Date range: `${{ inputs.start_date }}` ~ `${{ inputs.end_date }}`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run legacy single-account backfill
        shell: bash
        run: |
          set -euo pipefail
          CMD=(python backfill_single_legacy_sa.py
            --start "${{ inputs.start_date }}"
            --end "${{ inputs.end_date }}"
            --account_name "${{ inputs.account_name }}"
            --workers "${{ inputs.workers }}")

          [[ "${{ inputs.sync_dim_first_day }}" == "true" ]] && CMD+=(--sync_dim_first_day)
          [[ "${{ inputs.shopping_only }}" == "true" ]] && CMD+=(--shopping_only)
          [[ "${{ inputs.with_shop_ext }}" == "true" ]] && CMD+=(--with_shop_ext)

          printf 'Running:'
          printf ' %q' "${CMD[@]}"
          printf '\n'
          "${CMD[@]}"
