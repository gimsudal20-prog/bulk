name: 06 Auto OFF Check
run-name: 06 Auto OFF Check | ${{ github.event_name == 'workflow_dispatch' && 'manual' || 'hourly' }}

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  run-hourly-check:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NAVER_ADS_API_KEY: ${{ secrets.NAVER_ADS_API_KEY }}
      NAVER_ADS_SECRET: ${{ secrets.NAVER_ADS_SECRET }}
      CUSTOMER_ID: ${{ secrets.CUSTOMER_ID }}
      ACCOUNT_MASTER_FILE: account_master.xlsx
      ACCOUNT_MASTER_XLSX_B64: ${{ secrets.ACCOUNT_MASTER_XLSX_B64 }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write workflow guide
        if: always()
        run: |
          {
            echo "## 06 Auto OFF Check"
            echo
            echo "- Purpose: hourly auto check for OFF campaigns/accounts."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run OFF scanner
        run: python check_off.py
