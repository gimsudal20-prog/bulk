name: 04 비즈머니 일일 수집
run-name: 04 비즈머니 일일 수집 | ${{ github.event_name == 'workflow_dispatch' && '수동' || '스케줄' }}

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */4 * * *"

concurrency:
  group: bizmoney-daily
  cancel-in-progress: false

jobs:
  run-bizmoney:
    name: 비즈머니 수집 실행
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NAVER_ADS_API_KEY: ${{ secrets.NAVER_ADS_API_KEY }}
      NAVER_ADS_SECRET: ${{ secrets.NAVER_ADS_SECRET }}
      ACCOUNT_MASTER_FILE: account_master.xlsx
      ACCOUNT_MASTER_XLSX_B64: ${{ secrets.ACCOUNT_MASTER_XLSX_B64 }}

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 계정 마스터 복원
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f "${ACCOUNT_MASTER_FILE}" && -n "${ACCOUNT_MASTER_XLSX_B64:-}" ]]; then
            python - <<'PY'
          import base64
          import os
          import pathlib

          path = pathlib.Path(os.environ.get("ACCOUNT_MASTER_FILE") or "account_master.xlsx")
          path.write_bytes(base64.b64decode(os.environ["ACCOUNT_MASTER_XLSX_B64"]))
          print(f"restored {path}")
          PY
          fi
          test -f "${ACCOUNT_MASTER_FILE}"

      - name: 워크플로우 안내 작성
        if: always()
        run: |
          {
            echo "## 04 비즈머니 일일 수집"
            echo
            echo "- 목적: 계정별 비즈머니 잔액을 저장합니다."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 비즈머니 수집기 실행
        run: python collect_bizmoney.py
