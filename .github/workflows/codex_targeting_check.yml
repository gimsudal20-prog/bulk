name: Codex targeting check
run-name: Codex targeting check | 핵이득마켓 | 2026-05-29

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/codex_targeting_check.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: codex-targeting-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TZ: Asia/Seoul
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NAVER_API_KEY: ${{ secrets.NAVER_API_KEY || secrets.NAVER_ADS_API_KEY }}
      NAVER_API_SECRET: ${{ secrets.NAVER_API_SECRET || secrets.NAVER_ADS_SECRET }}
      ACCOUNT_MASTER_FILE: account_master.xlsx
      ACCOUNT_MASTER_XLSX_B64: ${{ secrets.ACCOUNT_MASTER_XLSX_B64 }}
      TARGET_DATE: "2026-05-29"
      TARGET_ACCOUNT_NAME: "핵이득마켓"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect target account
        run: |
          python collector_time_age.py \
            --date "${TARGET_DATE}" \
            --account_name "${TARGET_ACCOUNT_NAME}" \
            --workers 1 \
            --sync_campaigns \
            --verify \
            --require_age \
            --report_path codex-check-results/targeting_2026-05-29_haegideuk.json

      - name: Commit report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add codex-check-results/targeting_2026-05-29_haegideuk.json
          git commit -m "Add Codex targeting check result" || exit 0
          git push
