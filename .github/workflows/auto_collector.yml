name: 06 자동 OFF 확인
run-name: 06 자동 OFF 확인 | ${{ github.event_name == 'workflow_dispatch' && '수동' || '매시간' }}

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  run-hourly-check:
    name: OFF 상태 자동 확인
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NAVER_ADS_API_KEY: ${{ secrets.NAVER_ADS_API_KEY }}
      NAVER_ADS_SECRET: ${{ secrets.NAVER_ADS_SECRET }}
      CUSTOMER_ID: ${{ secrets.CUSTOMER_ID }}
      ACCOUNT_MASTER_FILE: account_master.xlsx
      ACCOUNT_MASTER_XLSX_B64: ${{ secrets.ACCOUNT_MASTER_XLSX_B64 }}

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 워크플로우 안내 작성
        if: always()
        run: |
          {
            echo "## 06 자동 OFF 확인"
            echo
            echo "- 목적: OFF 캠페인/계정을 매시간 자동 확인합니다."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: OFF 스캐너 실행
        run: python check_off.py
