name: 02 Manual Backfill
run-name: 02 Manual Backfill | ${{ inputs.account_name || inputs.account_names || 'all' }} | ${{ inputs.start_date }}~${{ inputs.end_date }}

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Start date (YYYY-MM-DD)"
        required: true
        default: "2026-03-11"
        type: string
      end_date:
        description: "End date (YYYY-MM-DD)"
        required: true
        default: "2026-03-18"
        type: string
      account_name:
        description: "Single account name"
        required: false
        default: ""
        type: string
      account_names:
        description: "Comma-separated account names"
        required: false
        default: ""
        type: string
      workers:
        description: "Concurrent workers"
        required: false
        default: "3"
        type: string
      fast:
        description: "Use fast collection mode"
        required: false
        default: false
        type: boolean
      collect_mode:
        description: "Collection mode"
        required: false
        default: sa_with_device
        type: choice
        options:
          - sa_with_device
          - sa_only
          - device_only
      sa_scope:
        description: "Search ad scope"
        required: false
        default: full
        type: choice
        options:
          - full
          - ad_only
      run_target:
        description: "Run target"
        required: false
        default: sa_only
        type: choice
        options:
          - sa_only
          - shop_ext_only
          - sa_and_shop_ext
      shop_ext_bucket:
        description: "Shop extension bucket"
        required: false
        default: shopping
        type: choice
        options:
          - shopping
          - non_shopping
          - all
      sync_dim_first_day:
        description: "Collect dimensions on the first day only"
        required: false
        default: false
        type: boolean
      with_gfa:
        description: "Also run GFA collection"
        required: false
        default: false
        type: boolean
      shopping_only:
        description: "Collect shopping search campaigns only"
        required: false
        default: false
        type: boolean
      with_shop_ext:
        description: "Also run shop extension collection"
        required: false
        default: false
        type: boolean

concurrency:
  group: fast-backfill-${{ inputs.account_name || inputs.account_names || 'all' }}-${{ inputs.start_date }}-${{ inputs.end_date }}
  cancel-in-progress: false

jobs:
  run-backfill:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NAVER_ADS_API_KEY: ${{ secrets.NAVER_ADS_API_KEY }}
      NAVER_ADS_SECRET: ${{ secrets.NAVER_ADS_SECRET }}
      ACCOUNT_MASTER_FILE: account_master.xlsx
      ACCOUNT_MASTER_XLSX_B64: ${{ secrets.ACCOUNT_MASTER_XLSX_B64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write workflow guide
        if: always()
        run: |
          {
            echo "## 02 Manual Backfill"
            echo
            echo "- Account: `${{ inputs.account_name || inputs.account_names || 'all' }}`"
            echo "- Date range: `${{ inputs.start_date }}` ~ `${{ inputs.end_date }}`"
            echo "- Mode: `${{ inputs.collect_mode }}` / scope: `${{ inputs.sa_scope }}`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run fast backfill
        shell: bash
        run: |
          set -euo pipefail
          CMD=(python fast_backfill.py
            --start "${{ inputs.start_date }}"
            --end "${{ inputs.end_date }}"
            --workers "${{ inputs.workers }}"
            --collect_mode "${{ inputs.collect_mode }}"
            --sa_scope "${{ inputs.sa_scope }}"
            --run_target "${{ inputs.run_target }}"
            --shop_ext_bucket "${{ inputs.shop_ext_bucket }}")

          [[ -n "${{ inputs.account_name }}" ]] && CMD+=(--account_name "${{ inputs.account_name }}")
          [[ -n "${{ inputs.account_names }}" ]] && CMD+=(--account_names "${{ inputs.account_names }}")
          [[ "${{ inputs.fast }}" == "true" ]] && CMD+=(--fast)
          [[ "${{ inputs.sync_dim_first_day }}" == "true" ]] && CMD+=(--sync_dim_first_day)
          [[ "${{ inputs.with_gfa }}" == "true" ]] && CMD+=(--with_gfa)
          [[ "${{ inputs.shopping_only }}" == "true" ]] && CMD+=(--shopping_only)
          [[ "${{ inputs.with_shop_ext }}" == "true" ]] && CMD+=(--with_shop_ext)

          printf 'Running:'
          printf ' %q' "${CMD[@]}"
          printf '\n'
          "${CMD[@]}"

      - name: Upload split debug rows
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: split-debug-rows-${{ github.run_number }}
          path: debug_split_rows/*.csv
          if-no-files-found: ignore
          retention-days: 3
