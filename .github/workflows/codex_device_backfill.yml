name: Codex Device Backfill

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/codex_device_backfill.yml"
  workflow_dispatch:

jobs:
  backfill-device:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NAVER_ADS_API_KEY: ${{ secrets.NAVER_ADS_API_KEY }}
      NAVER_ADS_SECRET: ${{ secrets.NAVER_ADS_SECRET }}
      ACCOUNT_MASTER_FILE: account_master.xlsx
      ACCOUNT_MASTER_XLSX_B64: ${{ secrets.ACCOUNT_MASTER_XLSX_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Restore account master
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f "${ACCOUNT_MASTER_FILE}" && -n "${ACCOUNT_MASTER_XLSX_B64:-}" ]]; then
            python - <<'PY'
          import base64
          import os
          from pathlib import Path
          Path(os.environ.get("ACCOUNT_MASTER_FILE") or "account_master.xlsx").write_bytes(base64.b64decode(os.environ["ACCOUNT_MASTER_XLSX_B64"]))
          PY
          fi
      - name: Run device-only backfill
        run: python collector.py --date 2026-05-30 --workers 2 --collect_mode device_only --skip_time_age
