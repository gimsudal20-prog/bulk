name: Codex keyword mapping backfill

on:
  push:
    paths:
      - ".github/workflows/codex_keyword_mapping_backfill.yml"

jobs:
  keyword-mapping-backfill:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NAVER_ADS_API_KEY: ${{ secrets.NAVER_ADS_API_KEY }}
      NAVER_ADS_SECRET: ${{ secrets.NAVER_ADS_SECRET }}
      ACCOUNT_MASTER_FILE: account_master.xlsx
      ACCOUNT_MASTER_XLSX_B64: ${{ secrets.ACCOUNT_MASTER_XLSX_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Recollect Hacker Market keyword conversions
        shell: bash
        run: |
          set -euo pipefail
          python collector.py --date 2026-05-29 --account_name "핵이득마켓" --workers 1 --collect_mode sa_only --skip_time_age
          python collector.py --date 2026-05-30 --account_name "핵이득마켓" --workers 1 --collect_mode sa_only --skip_time_age
