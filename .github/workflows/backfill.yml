name: 02 수동 백필
run-name: 02 수동 백필 | ${{ inputs.account_name || inputs.account_names || '전체' }} | ${{ inputs.start_date }}~${{ inputs.end_date }}

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "시작일(YYYY-MM-DD)"
        required: true
        default: "2026-03-11"
        type: string
      end_date:
        description: "종료일(YYYY-MM-DD)"
        required: true
        default: "2026-03-18"
        type: string
      account_name:
        description: "단일 계정명"
        required: false
        default: ""
        type: string
      account_names:
        description: "쉼표로 구분한 계정명"
        required: false
        default: ""
        type: string
      workers:
        description: "동시 작업자 수"
        required: false
        default: "3"
        type: string
      fast:
        description: "빠른 수집 모드 사용"
        required: false
        default: false
        type: boolean
      collect_mode:
        description: "수집 모드"
        required: false
        default: sa_with_device
        type: choice
        options:
          - sa_with_device
          - sa_only
          - device_only
      sa_scope:
        description: "검색광고 범위"
        required: false
        default: full
        type: choice
        options:
          - full
          - ad_only
      run_target:
        description: "실행 대상"
        required: false
        default: sa_only
        type: choice
        options:
          - sa_only
          - shop_ext_only
          - sa_and_shop_ext
      shop_ext_bucket:
        description: "쇼핑 확장 범위"
        required: false
        default: shopping
        type: choice
        options:
          - shopping
          - non_shopping
          - all
      sync_dim_first_day:
        description: "첫날에만 차원 정보 수집"
        required: false
        default: false
        type: boolean
      with_gfa:
        description: "GFA 수집도 실행"
        required: false
        default: false
        type: boolean
      shopping_only:
        description: "쇼핑 검색 캠페인만 수집"
        required: false
        default: false
        type: boolean
      with_shop_ext:
        description: "쇼핑 확장 수집도 실행"
        required: false
        default: false
        type: boolean
      with_placement:
        description: "검색/콘텐츠 지면 수집도 실행"
        required: false
        default: false
        type: boolean

concurrency:
  group: fast-backfill-${{ inputs.account_name || inputs.account_names || 'all' }}-${{ inputs.start_date }}-${{ inputs.end_date }}
  cancel-in-progress: false

jobs:
  run-backfill:
    name: 수동 백필 실행
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NAVER_ADS_API_KEY: ${{ secrets.NAVER_ADS_API_KEY }}
      NAVER_ADS_SECRET: ${{ secrets.NAVER_ADS_SECRET }}
      ACCOUNT_MASTER_FILE: account_master.xlsx
      ACCOUNT_MASTER_XLSX_B64: ${{ secrets.ACCOUNT_MASTER_XLSX_B64 }}

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 워크플로우 안내 작성
        if: always()
        run: |
          {
            echo "## 02 수동 백필"
            echo
            echo "- 계정: `${{ inputs.account_name || inputs.account_names || '전체' }}`"
            echo "- 기간: `${{ inputs.start_date }}` ~ `${{ inputs.end_date }}`"
            echo "- 모드: `${{ inputs.collect_mode }}` / 범위: `${{ inputs.sa_scope }}`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 빠른 백필 실행
        shell: bash
        run: |
          set -euo pipefail
          CMD=(python fast_backfill.py
            --start "${{ inputs.start_date }}"
            --end "${{ inputs.end_date }}"
            --workers "${{ inputs.workers }}"
            --collect_mode "${{ inputs.collect_mode }}"
            --sa_scope "${{ inputs.sa_scope }}"
            --run_target "${{ inputs.run_target }}"
            --shop_ext_bucket "${{ inputs.shop_ext_bucket }}")

          [[ -n "${{ inputs.account_name }}" ]] && CMD+=(--account_name "${{ inputs.account_name }}")
          [[ -n "${{ inputs.account_names }}" ]] && CMD+=(--account_names "${{ inputs.account_names }}")
          [[ "${{ inputs.fast }}" == "true" ]] && CMD+=(--fast)
          [[ "${{ inputs.sync_dim_first_day }}" == "true" ]] && CMD+=(--sync_dim_first_day)
          [[ "${{ inputs.with_gfa }}" == "true" ]] && CMD+=(--with_gfa)
          [[ "${{ inputs.shopping_only }}" == "true" ]] && CMD+=(--shopping_only)
          [[ "${{ inputs.with_shop_ext }}" == "true" ]] && CMD+=(--with_shop_ext)
          [[ "${{ inputs.with_placement }}" == "true" ]] && CMD+=(--with_placement)

          printf '실행 명령:'
          printf ' %q' "${CMD[@]}"
          printf '\n'
          "${CMD[@]}"

      - name: 분할 디버그 행 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: split-debug-rows-${{ github.run_number }}
          path: debug_split_rows/*.csv
          if-no-files-found: ignore
          retention-days: 3
