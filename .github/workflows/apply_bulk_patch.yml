name: Apply bulk cleanup patch

on:
  push:
    branches:
      - main
    paths:
      - bulk_patch.diff.gz.b64.part*
      - .github/workflows/apply_bulk_patch.yml

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -rf __pycache__
          rm -f account_master.xlsx accounts.xlsx accounts_gfa.xlsx accounts_meta.xlsx
          rm -f ./*.zip
          rm -f collector_media.py view_media.py

          python - <<'PY'
          import base64
          import gzip
          import pathlib

          payload = "".join(
              p.read_text(encoding="ascii").strip()
              for p in sorted(pathlib.Path(".").glob("bulk_patch.diff.gz.b64.part*"))
          )
          pathlib.Path("bulk_patch.diff").write_bytes(gzip.decompress(base64.b64decode(payload)))
          PY

          git apply --ignore-whitespace --whitespace=nowarn bulk_patch.diff

          rm -f bulk_patch.diff bulk_patch.diff.gz.b64.part*
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Apply bulk code cleanup patch"
          git push
