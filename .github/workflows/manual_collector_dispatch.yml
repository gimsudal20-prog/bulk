name: 수동 수집 실행
run-name: 수동 수집 | ${{ inputs.date || '어제' }} | ${{ inputs.account_name || inputs.account_names || inputs.customer_id || '전체' }}

on:
  workflow_dispatch:
    inputs:
      date:
        description: "수집일(YYYY-MM-DD). 비워두면 collector.py 기본값 사용."
        required: false
        type: string
      account_name:
        description: "단일 계정명 또는 일부 일치"
        required: false
        default: ""
        type: string
      account_names:
        description: "쉼표로 구분한 계정명"
        required: false
        default: ""
        type: string
      customer_id:
        description: "customer_id 직접 지정"
        required: false
        default: ""
        type: string
      workers:
        description: "동시 작업자 수"
        required: true
        default: "1"
        type: string
      collect_mode:
        description: "수집 모드"
        required: true
        default: sa_with_device
        type: choice
        options:
          - sa_with_device
          - sa_only
          - device_only
      sa_scope:
        description: "검색광고 범위"
        required: true
        default: full
        type: choice
        options:
          - full
          - ad_only
      shopping_only:
        description: "쇼핑 검색 캠페인만"
        required: true
        default: false
        type: boolean
      skip_dim:
        description: "차원 정보 동기화 건너뛰기"
        required: true
        default: false
        type: boolean
      fast:
        description: "빠른 수집 모드 사용"
        required: true
        default: false
        type: boolean
      include_gfa_accounts:
        description: "계정 마스터의 GFA 계정 포함"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: manual-collector-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-collector:
    name: 수동 수집 실행
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TZ: Asia/Seoul
      PYTHONUNBUFFERED: "1"
      NAVER_API_KEY: ${{ secrets.NAVER_API_KEY || secrets.NAVER_ADS_API_KEY }}
      NAVER_API_SECRET: ${{ secrets.NAVER_API_SECRET || secrets.NAVER_ADS_SECRET }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ACCOUNT_MASTER_FILE: ${{ vars.ACCOUNT_MASTER_FILE || 'account_master.xlsx' }}
      ACCOUNT_MASTER_XLSX_B64: ${{ secrets.ACCOUNT_MASTER_XLSX_B64 }}

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 의존성 설치
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 필수 시크릿 검증
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -z "${NAVER_API_KEY:-}" ]] && missing+=("NAVER_API_KEY or NAVER_ADS_API_KEY")
          [[ -z "${NAVER_API_SECRET:-}" ]] && missing+=("NAVER_API_SECRET or NAVER_ADS_SECRET")
          [[ -z "${DATABASE_URL:-}" ]] && missing+=("DATABASE_URL")

          if (( ${#missing[@]} > 0 )); then
            echo "누락된 GitHub Secrets: ${missing[*]}"
            exit 1
          fi

      - name: 실행 요약 표시
        shell: bash
        run: |
          echo "현재 KST: $(TZ=Asia/Seoul date '+%F %T')"
          echo "date=${{ inputs.date }}"
          echo "account_name=${{ inputs.account_name }}"
          echo "account_names=${{ inputs.account_names }}"
          echo "customer_id=${{ inputs.customer_id }}"
          echo "workers=${{ inputs.workers }}"
          echo "collect_mode=${{ inputs.collect_mode }}"
          echo "sa_scope=${{ inputs.sa_scope }}"
          echo "shopping_only=${{ inputs.shopping_only }}"
          echo "skip_dim=${{ inputs.skip_dim }}"
          echo "fast=${{ inputs.fast }}"
          echo "include_gfa_accounts=${{ inputs.include_gfa_accounts }}"

      - name: collector.py 실행
        shell: bash
        run: |
          set -euo pipefail
          CMD=(python collector.py)

          [[ -n "${{ inputs.date }}" ]] && CMD+=(--date "${{ inputs.date }}")
          [[ -n "${{ inputs.account_name }}" ]] && CMD+=(--account_name "${{ inputs.account_name }}")
          [[ -n "${{ inputs.account_names }}" ]] && CMD+=(--account_names "${{ inputs.account_names }}")
          [[ -n "${{ inputs.customer_id }}" ]] && CMD+=(--customer_id "${{ inputs.customer_id }}")
          [[ -n "${{ inputs.workers }}" ]] && CMD+=(--workers "${{ inputs.workers }}")
          [[ -n "${{ inputs.collect_mode }}" ]] && CMD+=(--collect_mode "${{ inputs.collect_mode }}")
          [[ -n "${{ inputs.sa_scope }}" ]] && CMD+=(--sa_scope "${{ inputs.sa_scope }}")

          [[ "${{ inputs.shopping_only }}" == "true" ]] && CMD+=(--shopping_only)
          [[ "${{ inputs.skip_dim }}" == "true" ]] && CMD+=(--skip_dim)
          [[ "${{ inputs.fast }}" == "true" ]] && CMD+=(--fast)
          [[ "${{ inputs.include_gfa_accounts }}" == "true" ]] && CMD+=(--include_gfa_accounts)

          echo "실행 명령: ${CMD[*]}"
          "${CMD[@]}" 2>&1 | tee manual_collector.log

      - name: 실행 로그 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-collector-log-${{ github.run_id }}
          path: manual_collector.log
          if-no-files-found: warn
