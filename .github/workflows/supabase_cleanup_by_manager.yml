name: Supabase Manager Cleanup
run-name: Supabase Cleanup | ${{ inputs.managers }} | ${{ inputs.mode }}

on:
  workflow_dispatch:
    inputs:
      managers:
        description: "Manager names to delete, comma-separated"
        required: true
        default: "민아,미현,정윤"
        type: string
      mode:
        description: "Execution mode"
        required: true
        default: dry_run
        type: choice
        options:
          - dry_run
          - execute_delete

concurrency:
  group: supabase-cleanup-by-manager
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ACCOUNT_MASTER_FILE: account_master.xlsx
      ACCOUNT_MASTER_XLSX_B64: ${{ secrets.ACCOUNT_MASTER_XLSX_B64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl SQLAlchemy psycopg2-binary

      - name: Restore account master
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f "${ACCOUNT_MASTER_FILE}" && -n "${ACCOUNT_MASTER_XLSX_B64:-}" ]]; then
            python - <<'PY'
          import base64
          import os
          import pathlib

          path = pathlib.Path(os.environ.get("ACCOUNT_MASTER_FILE") or "account_master.xlsx")
          path.write_bytes(base64.b64decode(os.environ["ACCOUNT_MASTER_XLSX_B64"]))
          print(f"restored {path}")
          PY
          fi
          test -f "${ACCOUNT_MASTER_FILE}"

      - name: DRY-RUN preview
        if: ${{ inputs.mode == 'dry_run' }}
        run: |
          python cleanup_supabase_by_manager.py \
            --account-master "${ACCOUNT_MASTER_FILE}" \
            --managers "${{ inputs.managers }}" \
            --export-targets cleanup_targets.csv

      - name: EXECUTE delete
        if: ${{ inputs.mode == 'execute_delete' }}
        run: |
          python cleanup_supabase_by_manager.py \
            --account-master "${ACCOUNT_MASTER_FILE}" \
            --managers "${{ inputs.managers }}" \
            --export-targets cleanup_targets.csv \
            --execute

      - name: Upload cleanup target list
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cleanup-targets-${{ github.run_number }}
          path: cleanup_targets.csv
          if-no-files-found: ignore
