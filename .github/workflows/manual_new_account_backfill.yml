name: 03 신규 계정 백필
run-name: 03 신규 계정 백필 | ${{ inputs.account_name }} | ${{ inputs.start_date }}~${{ inputs.end_date }}

on:
  workflow_dispatch:
    inputs:
      account_name:
        description: "백필할 계정명"
        required: true
        type: string
      start_date:
        description: "시작일(YYYY-MM-DD)"
        required: true
        default: "2026-02-01"
        type: string
      end_date:
        description: "종료일(YYYY-MM-DD)"
        required: true
        default: "2026-03-10"
        type: string
      workers:
        description: "동시 작업자 수"
        required: true
        default: "1"
        type: string
      sync_dim_first_day:
        description: "첫날에만 차원 정보 수집"
        required: true
        default: true
        type: boolean
      shopping_only:
        description: "쇼핑 검색 캠페인만 수집"
        required: false
        default: false
        type: boolean
      with_shop_ext:
        description: "쇼핑 확장 수집도 실행"
        required: false
        default: false
        type: boolean

concurrency:
  group: manual-new-account-backfill-${{ inputs.account_name }}
  cancel-in-progress: false

jobs:
  backfill:
    name: 신규 계정 백필 실행
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NAVER_ADS_API_KEY: ${{ secrets.NAVER_ADS_API_KEY }}
      NAVER_ADS_SECRET: ${{ secrets.NAVER_ADS_SECRET }}
      ACCOUNT_MASTER_FILE: account_master.xlsx
      ACCOUNT_MASTER_XLSX_B64: ${{ secrets.ACCOUNT_MASTER_XLSX_B64 }}

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 워크플로우 안내 작성
        if: always()
        run: |
          {
            echo "## 03 신규 계정 백필"
            echo
            echo "- 계정: `${{ inputs.account_name }}`"
            echo "- 기간: `${{ inputs.start_date }}` ~ `${{ inputs.end_date }}`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 레거시 단일 계정 백필 실행
        shell: bash
        run: |
          set -euo pipefail
          CMD=(python backfill_single_legacy_sa.py
            --start "${{ inputs.start_date }}"
            --end "${{ inputs.end_date }}"
            --account_name "${{ inputs.account_name }}"
            --workers "${{ inputs.workers }}")

          [[ "${{ inputs.sync_dim_first_day }}" == "true" ]] && CMD+=(--sync_dim_first_day)
          [[ "${{ inputs.shopping_only }}" == "true" ]] && CMD+=(--shopping_only)
          [[ "${{ inputs.with_shop_ext }}" == "true" ]] && CMD+=(--with_shop_ext)

          printf '실행 명령:'
          printf ' %q' "${CMD[@]}"
          printf '\n'
          "${CMD[@]}"
