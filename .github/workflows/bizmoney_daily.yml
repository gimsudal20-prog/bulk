name: 04 BizMoney Daily Collection
run-name: 04 BizMoney Daily Collection | ${{ github.event_name == 'workflow_dispatch' && 'manual' || 'schedule' }}

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */4 * * *"

concurrency:
  group: bizmoney-daily
  cancel-in-progress: false

jobs:
  run-bizmoney:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NAVER_ADS_API_KEY: ${{ secrets.NAVER_ADS_API_KEY }}
      NAVER_ADS_SECRET: ${{ secrets.NAVER_ADS_SECRET }}
      ACCOUNT_MASTER_FILE: account_master.xlsx
      ACCOUNT_MASTER_XLSX_B64: ${{ secrets.ACCOUNT_MASTER_XLSX_B64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore account master
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f "${ACCOUNT_MASTER_FILE}" && -n "${ACCOUNT_MASTER_XLSX_B64:-}" ]]; then
            python - <<'PY'
          import base64
          import os
          import pathlib

          path = pathlib.Path(os.environ.get("ACCOUNT_MASTER_FILE") or "account_master.xlsx")
          path.write_bytes(base64.b64decode(os.environ["ACCOUNT_MASTER_XLSX_B64"]))
          print(f"restored {path}")
          PY
          fi
          test -f "${ACCOUNT_MASTER_FILE}"

      - name: Write workflow guide
        if: always()
        run: |
          {
            echo "## 04 BizMoney Daily Collection"
            echo
            echo "- Purpose: save account-level BizMoney balances."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run BizMoney collector
        run: python collect_bizmoney.py
