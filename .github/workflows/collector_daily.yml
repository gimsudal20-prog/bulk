name: 01 Main Daily Collection
run-name: 01 Main Daily Collection | ${{ github.event_name == 'workflow_dispatch' && format('manual | {0} | fast={1}', inputs.collect_mode, inputs.fast) || 'schedule' }}

on:
  schedule:
    - cron: "7 19,1,7 * * *"   # KST 04:07 / 10:07 / 16:07
  workflow_dispatch:
    inputs:
      collect_mode:
        description: "Collection mode"
        required: false
        default: sa_with_device
        type: choice
        options:
          - sa_with_device
          - sa_only
          - device_only
      fast:
        description: "Use fast mode for manual run"
        required: false
        default: true
        type: boolean

concurrency:
  group: collector-daily
  cancel-in-progress: false

jobs:
  run-collector:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NAVER_ADS_API_KEY: ${{ secrets.NAVER_ADS_API_KEY }}
      NAVER_ADS_SECRET: ${{ secrets.NAVER_ADS_SECRET }}
      ACCOUNT_MASTER_FILE: account_master.xlsx
      ACCOUNT_MASTER_XLSX_B64: ${{ secrets.ACCOUNT_MASTER_XLSX_B64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write workflow guide
        if: always()
        run: |
          {
            echo "## 01 Main Daily Collection"
            echo
            echo "- Manual mode: `${{ inputs.collect_mode || 'sa_with_device' }}`"
            echo "- Manual fast: `${{ inputs.fast || true }}`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run collector
        shell: bash
        env:
          DISPATCH_COLLECT_MODE: ${{ inputs.collect_mode }}
          DISPATCH_FAST: ${{ inputs.fast }}
        run: |
          set -euo pipefail
          echo "Current KST: $(date +%F' '%H:%M:%S)"

          KST_HOUR=$(date +%H)
          YESTERDAY=$(date -d "yesterday" +%F)
          TODAY=$(date +%F)
          COLLECT_MODE="${DISPATCH_COLLECT_MODE:-sa_with_device}"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            FAST_FLAG=""
            [[ "${DISPATCH_FAST:-true}" == "true" ]] && FAST_FLAG="--fast"
            python collector.py --date "${YESTERDAY}" --workers 2 --collect_mode "${COLLECT_MODE}" ${FAST_FLAG}
          else
            if [[ "${KST_HOUR}" == "04" ]]; then
              python collector.py --date "${YESTERDAY}" --workers 2 --collect_mode "${COLLECT_MODE}"
            else
              python fast_backfill.py --start "${YESTERDAY}" --end "${YESTERDAY}" --workers 2 --collect_mode "${COLLECT_MODE}" --sync_dim_first_day
            fi

            if [[ "${COLLECT_MODE}" == "device_only" ]]; then
              echo "Skipping same-day fast refresh in device_only mode."
            else
              python collector.py --date "${TODAY}" --workers 2 --collect_mode "${COLLECT_MODE}" --fast
            fi
          fi
