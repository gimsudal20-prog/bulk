name: 01 메인 일일 수집
run-name: 01 메인 일일 수집 | ${{ github.event_name == 'workflow_dispatch' && format('수동 | {0} | 빠른실행={1}', inputs.collect_mode, inputs.fast) || github.event_name == 'push' && '즉시' || '스케줄' }}

on:
  push:
    branches:
      - main
    paths:
      - "collector.py"
      - "collector_*.py"
      - "collector*.py"
      - "device_collector_helpers.py"
      - "targeting_collector_helpers.py"
      - ".github/workflows/collector_daily.yml"
  schedule:
    - cron: "7 19,1,7 * * *"   # KST 04:07 / 10:07 / 16:07
  workflow_dispatch:
    inputs:
      collect_mode:
        description: "수집 모드"
        required: false
        default: sa_with_device
        type: choice
        options:
          - sa_with_device
          - sa_only
          - device_only
      fast:
        description: "수동 실행 시 빠른 모드 사용"
        required: false
        default: true
        type: boolean

concurrency:
  group: collector-daily
  cancel-in-progress: false

jobs:
  run-collector:
    name: 메인 수집 실행
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NAVER_ADS_API_KEY: ${{ secrets.NAVER_ADS_API_KEY }}
      NAVER_ADS_SECRET: ${{ secrets.NAVER_ADS_SECRET }}
      ACCOUNT_MASTER_FILE: account_master.xlsx
      ACCOUNT_MASTER_XLSX_B64: ${{ secrets.ACCOUNT_MASTER_XLSX_B64 }}

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 워크플로우 안내 작성
        if: always()
        run: |
          {
            echo "## 01 메인 일일 수집"
            echo
            echo "- 수동 모드: `${{ inputs.collect_mode || 'sa_with_device' }}`"
            echo "- 빠른 실행: `${{ inputs.fast || true }}`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 수집기 실행
        shell: bash
        env:
          DISPATCH_COLLECT_MODE: ${{ inputs.collect_mode }}
          DISPATCH_FAST: ${{ inputs.fast }}
        run: |
          set -euo pipefail
          echo "현재 KST: $(date +%F' '%H:%M:%S)"

          KST_HOUR=$(date +%H)
          YESTERDAY=$(date -d "yesterday" +%F)
          TODAY=$(date +%F)
          COLLECT_MODE="${DISPATCH_COLLECT_MODE:-sa_with_device}"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            FAST_FLAG=""
            [[ "${DISPATCH_FAST:-true}" == "true" ]] && FAST_FLAG="--fast"
            python collector.py --date "${YESTERDAY}" --workers 2 --collect_mode "${COLLECT_MODE}" --skip_time_age ${FAST_FLAG}
            python collector_time_age.py --date "${YESTERDAY}" --workers 2 --sync_campaigns
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            python collector.py --date "${YESTERDAY}" --workers 2 --collect_mode "${COLLECT_MODE}" --skip_time_age
            python collector_time_age.py --date "${YESTERDAY}" --workers 2 --sync_campaigns
          else
            if [[ "${KST_HOUR}" == "04" ]]; then
              python collector.py --date "${YESTERDAY}" --workers 2 --collect_mode "${COLLECT_MODE}" --skip_time_age
            else
              python fast_backfill.py --start "${YESTERDAY}" --end "${YESTERDAY}" --workers 2 --collect_mode "${COLLECT_MODE}" --sync_dim_first_day --skip_time_age
            fi
            python collector_time_age.py --date "${YESTERDAY}" --workers 2 --sync_campaigns

            if [[ "${COLLECT_MODE}" == "device_only" ]]; then
              echo "device_only 모드에서는 당일 빠른 갱신을 건너뜁니다."
            else
              python collector.py --date "${TODAY}" --workers 2 --collect_mode "${COLLECT_MODE}" --fast --skip_time_age
              python collector_time_age.py --date "${TODAY}" --workers 2 --sync_campaigns
            fi
          fi
