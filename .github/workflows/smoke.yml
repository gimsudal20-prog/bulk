name: 00 코드 스모크 체크
run-name: 00 코드 스모크 체크 | ${{ github.event_name == 'workflow_dispatch' && '수동' || github.event_name == 'pull_request' && 'PR' || '푸시' }}

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: 코드 스모크 체크 실행
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 스모크 체크 실행
        run: python smoke_check.py --with-help --with-regression
