name: 09 검색콘텐츠 지면 수집
run-name: 09 검색콘텐츠 지면 수집 | ${{ github.event_name == 'workflow_dispatch' && '수동' || github.event_name == 'push' && '즉시' || '스케줄' }}

on:
  schedule:
    - cron: "10 20 * * *" # KST 05:10
  push:
    branches:
      - main
    paths:
      - ".github/workflows/09-placement-collector.yml"
      - "placement_collector.py"
      - "placement_collector_helpers.py"
      - "collector_api.py"
      - "collector_db.py"
      - "account_master.py"
  workflow_dispatch:
    inputs:
      date:
        description: "수집일(YYYY-MM-DD). 비우면 어제"
        required: false
        default: ""
        type: string
      account_name:
        description: "계정명 일부 필터. 비우면 전체 검색광고 계정"
        required: false
        default: ""
        type: string
      customer_id:
        description: "네이버 고객 ID. 비우면 전체 검색광고 계정"
        required: false
        default: ""
        type: string
      skip_dim:
        description: "캠페인/광고그룹 구조 동기화 건너뛰기"
        required: false
        default: false
        type: boolean

concurrency:
  group: placement-collector
  cancel-in-progress: true

jobs:
  run-placement-collector:
    name: 검색콘텐츠 지면 수집 실행
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NAVER_ADS_API_KEY: ${{ secrets.NAVER_ADS_API_KEY }}
      NAVER_ADS_SECRET: ${{ secrets.NAVER_ADS_SECRET }}
      ACCOUNT_MASTER_FILE: account_master.xlsx
      ACCOUNT_MASTER_XLSX_B64: ${{ secrets.ACCOUNT_MASTER_XLSX_B64 }}
      PLACEMENT_REPORT_TYPES: DA_RAW_SSA,AD
      PLACEMENT_MEDIA_LOOKUP: "1"
      PLACEMENT_UNKNOWN_MEDIA_AS_CONTENT: "1"

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 워크플로우 안내 작성
        if: always()
        run: |
          {
            echo "## 09 검색콘텐츠 지면 수집"
            echo
            echo "- 리포트: ${PLACEMENT_REPORT_TYPES:-AD}"
            echo "- 저장 테이블: fact_adgroup_placement_daily"
            echo "- 스케줄: 매일 KST 05:10, 기본 수집일은 어제"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 지면 수집기 실행
        shell: bash
        run: |
          set -euo pipefail
          CMD=(python placement_collector.py --workers 2)
          [[ -n "${{ inputs.date }}" ]] && CMD+=(--date "${{ inputs.date }}")
          [[ -n "${{ inputs.account_name }}" ]] && CMD+=(--account_name "${{ inputs.account_name }}")
          [[ -n "${{ inputs.customer_id }}" ]] && CMD+=(--customer_id "${{ inputs.customer_id }}")
          [[ "${{ inputs.skip_dim || false }}" == "true" ]] && CMD+=(--skip_dim)

          printf '실행 명령:'
          printf ' %q' "${CMD[@]}"
          printf '\n'
          "${CMD[@]}"

      - name: Upload placement debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: placement-debug-${{ github.run_id }}
          path: |
            debug_reports/*placement*.json
            debug_reports/*_DA_RAW_SSA_*.txt
            debug_reports/*_AD_*.txt
            debug_reports/*_AD_DETAIL_*.txt
            debug_reports/media_lists/*.xlsx
          if-no-files-found: ignore
          retention-days: 7
